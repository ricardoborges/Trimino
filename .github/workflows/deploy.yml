# Deploy na Cloudflare a cada push no branch `producao` (ex.: git push origin main:producao).
# Todo deploy reinicia as mesas (a partida fica na memória do Durable Object): publique quando a varanda estiver vazia.
#
# Secrets do repositório: CLOUDFLARE_API_TOKEN (Workers Scripts e D1, edição) e CLOUDFLARE_ACCOUNT_ID.
# Os secrets do Worker (Google, PUBLIC_URL, DeepSeek, TURN) ficam na Cloudflare: `npx wrangler secret put NOME`.
name: Deploy

on:
  push:
    branches: [producao]
  workflow_dispatch:

# Um deploy por vez; um novo push espera o anterior terminar.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Migrações antes do código novo: elas precisam ser compatíveis com a versão que ainda está no ar.
      - name: Migrações do D1
        working-directory: server
        run: npx wrangler d1 migrations apply trimino --remote
      - name: Publicar o Worker
        working-directory: server
        run: npx wrangler deploy

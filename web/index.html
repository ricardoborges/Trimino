<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#123528" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Triminó</title>
  </head>
  <body>
    <div id="lobby" class="lobby">
      <form id="join-form" class="card">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 64 56"><path d="M32 2 62 54H2Z" /></svg>
        </div>
        <h1>Triminó</h1>
        <p class="sub">Dominó triangular com vídeo, para 2 a 4 jogadores.</p>
        <label>Seu nome <input name="name" maxlength="24" required autocomplete="nickname" /></label>
        <label>Sala <input name="room" maxlength="12" required autocapitalize="characters" /></label>
        <label class="check"><input type="checkbox" name="media" checked /> Entrar com câmera e microfone</label>
        <button type="submit" class="primary">Entrar</button>
      </form>
    </div>

    <div id="app" class="app" hidden>
      <header class="topbar">
        <strong class="brand">Triminó</strong>
        <button id="room-code" class="chip" title="Copiar link da sala"></button>
        <span id="status" class="status"></span>
        <ol id="scores" class="scores"></ol>
      </header>

      <main class="main">
        <section id="table" class="table">
          <div id="banner" class="banner"></div>
          <div class="table-tools">
            <span id="pool" class="chip"></span>
            <button id="view" class="chip" title="Alternar vista 3D / de cima">Topo</button>
            <button id="fit" class="chip" title="Centralizar tabuleiro">⤢</button>
          </div>
          <div id="overlay" class="overlay" hidden></div>
        </section>

        <aside class="side">
          <div id="videos" class="videos"></div>
          <div class="media-tools">
            <button id="mic" class="tool">🎤</button>
            <button id="cam" class="tool">📷</button>
          </div>
          <ul id="log" class="log"></ul>
          <form id="chat-form" class="chat">
            <input name="text" maxlength="300" placeholder="Mensagem…" autocomplete="off" />
          </form>
        </aside>
      </main>

      <footer class="dock">
        <div id="hand" class="hand"></div>
        <div class="actions">
          <button id="rotate" class="secondary" title="Girar (R)">⟳ Girar</button>
          <button id="play" class="primary" title="Jogar (Enter)">Jogar</button>
          <button id="draw" class="secondary">Comprar</button>
          <button id="pass" class="secondary">Passar</button>
        </div>
      </footer>
    </div>
    <div id="toast" class="toast" role="status"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
